<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2> Calculatrice</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre 1</label>
            <input type="number" name="a" step="any" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nombre 2</label>
            <input type="number" name="b" step="any" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Opération</label>
            <select name="operation" class="form-select" required>
                <option value="+">Addition (+)</option>
                <option value="-">Soustraction (-)</option>
                <option value="*">Multiplication (*)</option>
                <option value="/">Division (/)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Calculer</button>
    </form>

    {% if result is not none %}
        <div class="alert alert-info mt-4">
            Résultat : {{ result }}
        </div>
    {% endif %}
</div>
</body>
</html>
